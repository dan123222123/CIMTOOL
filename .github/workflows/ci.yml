name: ci

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ── Job 1: validate MATLAB code ─────────────────────────────────────────────
  # NOTE: this currently only loads the code onto the path and cd's into tests/
  # as a smoke check — it does not yet execute the test scripts. Wiring up the
  # actual tests (and confirming they run headless / without NLEVP) is a TODO.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      # Tests are plain scripts (not matlab.unittest), so use run-command.
      # A MATLAB error (non-zero exit) will fail this step.
      - name: Run tests
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(genpath('src')); cd('tests');

  # ── Job 2: build and deploy documentation ───────────────────────────────────
  # Static mkdocs build (docstrings parsed statically by mkdocstrings-matlab —
  # no MATLAB engine needed) deployed to the gh-pages branch. This is the
  # long-standing working docs pipeline. The Quarto/mkernel "reactive docs"
  # overhaul lives on the `doc_overhaul` branch: it renders live MATLAB, which
  # needs a MATLAB license the hosted runners don't grant to a standalone
  # engine, so it is intentionally kept off main.
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      # mkdocstrings-matlab caps Python (<3.15 as of 2.1.3), so `3.x` broke
      # the install the day 3.15 reached the runners. Keep in step with the
      # python in flake.nix.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - run: pip install mkdocs-material
      - run: pip install mkdocstrings-matlab==2.0.1
      - run: pip install mkdocs-awesome-nav
      - run: mkdocs gh-deploy --force
